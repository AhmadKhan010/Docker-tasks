services:
  server:
    build: ./server
    container_name: python_server
    volumes:
      - ./server:/app
    # no ports mentioned here because we don't want to expose server to outside
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # We use python's built-in urllib to check the endpoint
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')" ]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 2s

  client:
    build: ./client
    container_name: python_client
    volumes:
      - ./client:/app
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      server:
        # The client will only start after the server's healthcheck passes
        condition: service_healthy
